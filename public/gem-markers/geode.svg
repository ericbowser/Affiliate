<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" width="36" height="44">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00000033"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Outer rock shell - rough/irregular -->
    <ellipse cx="18" cy="20" rx="16" ry="17" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
    <ellipse cx="18" cy="20" rx="16" ry="17" fill="#a8a29e" opacity="0.6"/>
    <!-- Rock texture spots -->
    <circle cx="8" cy="14" r="2" fill="#78716c" opacity="0.3"/>
    <circle cx="28" cy="26" r="1.5" fill="#78716c" opacity="0.25"/>
    <circle cx="10" cy="28" r="1.8" fill="#78716c" opacity="0.2"/>
    <!-- Inner cavity - lighter rim -->
    <ellipse cx="18" cy="19" rx="11" ry="12" fill="#d6d3d1" stroke="#a8a29e" stroke-width="0.6"/>
    <!-- Crystal cavity fill -->
    <ellipse cx="18" cy="19" rx="9" ry="10" fill="#7c3aed"/>
    <!-- Jagged amethyst crystal spikes pointing inward -->
    <polygon points="12,11 14,19 10,18" fill="#a78bfa" stroke="#6d28d9" stroke-width="0.4"/>
    <polygon points="15,9 17,18 13,16" fill="#c4b5fd" stroke="#7c3aed" stroke-width="0.4"/>
    <polygon points="20,8 19,17 22,15" fill="#ddd6fe" stroke="#7c3aed" stroke-width="0.4"/>
    <polygon points="24,10 22,18 26,17" fill="#a78bfa" stroke="#6d28d9" stroke-width="0.4"/>
    <polygon points="26,14 23,20 27,21" fill="#8b5cf6" stroke="#6d28d9" stroke-width="0.4"/>
    <polygon points="25,23 22,21 26,26" fill="#7c3aed" stroke="#5b21b6" stroke-width="0.4"/>
    <polygon points="22,27 19,22 21,29" fill="#6d28d9" stroke="#5b21b6" stroke-width="0.4"/>
    <polygon points="17,29 18,22 15,28" fill="#7c3aed" stroke="#5b21b6" stroke-width="0.4"/>
    <polygon points="12,26 15,21 11,24" fill="#8b5cf6" stroke="#6d28d9" stroke-width="0.4"/>
    <polygon points="10,19 14,20 10,15" fill="#6d28d9" stroke="#5b21b6" stroke-width="0.4"/>
    <!-- Center sparkle -->
    <circle cx="18" cy="19" r="1.5" fill="white" opacity="0.5"/>
    <line x1="18" y1="15" x2="18" y2="23" stroke="white" stroke-width="0.4" opacity="0.3"/>
    <line x1="14" y1="19" x2="22" y2="19" stroke="white" stroke-width="0.4" opacity="0.3"/>
    <!-- Ground shadow -->
    <ellipse cx="18" cy="40" rx="10" ry="3" fill="#00000018"/>
  </g>
</svg>