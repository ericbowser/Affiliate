<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" width="36" height="44">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00000033"/></filter>
    <radialGradient id="pg" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>
  <g filter="url(#shadow)">
    <!-- Small rounded pyrope pebble - smooth, not faceted -->
    <!-- Main body - slightly irregular round shape -->
    <ellipse cx="18" cy="19" rx="12" ry="11" fill="url(#pg)" stroke="#581111" stroke-width="0.8"/>
    <!-- Deep wine-red color indicator - darker than regular garnet -->
    <ellipse cx="20" cy="22" rx="8" ry="7" fill="#7f1d1d" opacity="0.3"/>
    <!-- Internal depth/translucency -->
    <ellipse cx="16" cy="17" rx="5" ry="4" fill="#dc2626" opacity="0.25"/>
    <!-- Surface luster - rounded highlight (pebble-like) -->
    <ellipse cx="14" cy="14" rx="5" ry="3.5" fill="white" opacity="0.2" transform="rotate(-20 14 14)"/>
    <ellipse cx="13" cy="13" rx="2.5" ry="1.5" fill="white" opacity="0.25" transform="rotate(-20 13 13)"/>
    <!-- Tiny surface sparkle points -->
    <circle cx="16" cy="12" r="0.6" fill="white" opacity="0.35"/>
    <circle cx="22" cy="16" r="0.4" fill="white" opacity="0.2"/>
    <!-- "Arizona Ruby" deep red glow -->
    <ellipse cx="18" cy="19" rx="6" ry="5" fill="#dc2626" opacity="0.15"/>
    <!-- Ground shadow -->
    <ellipse cx="18" cy="40" rx="8" ry="3" fill="#00000018"/>
  </g>
</svg>