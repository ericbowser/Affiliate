<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" width="36" height="44">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00000033"/></filter>
    <clipPath id="oc"><ellipse cx="18" cy="19" rx="13" ry="14"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <!-- Black opal cabochon - oval polished stone -->
    <ellipse cx="18" cy="19" rx="13" ry="14" fill="#1a1a2e" stroke="#0f0f1a" stroke-width="0.8"/>
    <!-- Dark body base -->
    <ellipse cx="18" cy="19" rx="12" ry="13" fill="#16213e" opacity="0.6"/>
    <!-- Play-of-color: rainbow fire flashes -->
    <g clip-path="url(#oc)">
      <!-- Red/orange fire band -->
      <ellipse cx="14" cy="15" rx="6" ry="2.5" fill="#ef4444" opacity="0.55" transform="rotate(-20 14 15)"/>
      <ellipse cx="15" cy="16" rx="4" ry="1.5" fill="#f97316" opacity="0.4" transform="rotate(-20 15 16)"/>
      <!-- Green fire flash -->
      <ellipse cx="20" cy="20" rx="5" ry="2" fill="#22c55e" opacity="0.45" transform="rotate(10 20 20)"/>
      <ellipse cx="21" cy="20.5" rx="3" ry="1" fill="#4ade80" opacity="0.3" transform="rotate(10 21 20.5)"/>
      <!-- Blue fire flash -->
      <ellipse cx="13" cy="23" rx="5" ry="2" fill="#3b82f6" opacity="0.4" transform="rotate(-10 13 23)"/>
      <ellipse cx="14" cy="23.5" rx="3" ry="1" fill="#60a5fa" opacity="0.3" transform="rotate(-10 14 23.5)"/>
      <!-- Violet flash -->
      <ellipse cx="22" cy="14" rx="3.5" ry="1.5" fill="#8b5cf6" opacity="0.35" transform="rotate(15 22 14)"/>
      <!-- Yellow/gold flash -->
      <ellipse cx="18" cy="26" rx="4" ry="1.5" fill="#eab308" opacity="0.3" transform="rotate(5 18 26)"/>
      <!-- Cyan shimmer -->
      <ellipse cx="24" cy="22" rx="2.5" ry="1.2" fill="#06b6d4" opacity="0.3" transform="rotate(20 24 22)"/>
    </g>
    <!-- Main cabochon luster dome -->
    <ellipse cx="15" cy="13" rx="5" ry="4" fill="white" opacity="0.12" transform="rotate(-15 15 13)"/>
    <ellipse cx="14" cy="12" rx="2.5" ry="1.5" fill="white" opacity="0.2" transform="rotate(-15 14 12)"/>
    <!-- Ground shadow -->
    <ellipse cx="18" cy="40" rx="9" ry="3" fill="#00000018"/>
  </g>
</svg>