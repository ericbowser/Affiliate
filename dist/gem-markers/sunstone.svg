<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" width="36" height="44">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00000033"/></filter>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <clipPath id="sc"><ellipse cx="18" cy="20" rx="13" ry="15"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <!-- Feldspar crystal - tabular/blocky shape -->
    <ellipse cx="18" cy="20" rx="13" ry="15" fill="url(#sg)" stroke="#b45309" stroke-width="0.8"/>
    <!-- Translucent body with warm glow -->
    <ellipse cx="16" cy="18" rx="9" ry="10" fill="#fde68a" opacity="0.3"/>
    <!-- Copper platelet aventurescence sparkles -->
    <g clip-path="url(#sc)">
      <!-- Scattered copper inclusions -->
      <circle cx="12" cy="14" r="0.8" fill="#f59e0b" opacity="0.8"/>
      <circle cx="20" cy="12" r="1" fill="#fbbf24" opacity="0.9"/>
      <circle cx="15" cy="18" r="0.7" fill="#f59e0b" opacity="0.7"/>
      <circle cx="22" cy="16" r="0.9" fill="#fde68a" opacity="0.8"/>
      <circle cx="10" cy="22" r="0.8" fill="#f59e0b" opacity="0.6"/>
      <circle cx="18" cy="24" r="1.1" fill="#fbbf24" opacity="0.8"/>
      <circle cx="24" cy="22" r="0.7" fill="#fde68a" opacity="0.7"/>
      <circle cx="14" cy="26" r="0.9" fill="#f59e0b" opacity="0.6"/>
      <circle cx="21" cy="28" r="0.8" fill="#fbbf24" opacity="0.5"/>
      <circle cx="16" cy="10" r="0.6" fill="#fef3c7" opacity="0.9"/>
      <circle cx="25" cy="19" r="0.5" fill="white" opacity="0.7"/>
      <circle cx="11" cy="17" r="0.6" fill="white" opacity="0.6"/>
      <!-- Schiller flash - the main aventurescence band -->
      <ellipse cx="16" cy="17" rx="7" ry="3" fill="white" opacity="0.2" transform="rotate(-25 16 17)"/>
      <ellipse cx="17" cy="18" rx="5" ry="1.5" fill="#fef3c7" opacity="0.3" transform="rotate(-25 17 18)"/>
    </g>
    <!-- Main luster highlight -->
    <ellipse cx="13" cy="13" rx="4" ry="5" fill="white" opacity="0.2" transform="rotate(-15 13 13)"/>
    <!-- Ground shadow -->
    <ellipse cx="18" cy="40" rx="9" ry="3" fill="#00000018"/>
  </g>
</svg>