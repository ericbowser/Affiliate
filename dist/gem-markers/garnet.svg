<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" width="36" height="44">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00000033"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Dodecahedral garnet - 12-sided crystal viewed at angle -->
    <!-- Top diamond face -->
    <polygon points="18,3 26,9 18,15 10,9" fill="#fca5a5" stroke="#7f1d1d" stroke-width="0.6"/>
    <!-- Upper left face -->
    <polygon points="10,9 6,14 6,22 12,18" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.5"/>
    <!-- Upper right face -->
    <polygon points="26,9 30,14 30,22 24,18" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.5"/>
    <!-- Front left face -->
    <polygon points="10,9 18,15 12,18 6,14" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.5"/>
    <!-- Front right face -->
    <polygon points="26,9 18,15 24,18 30,14" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.5"/>
    <!-- Center left face -->
    <polygon points="12,18 18,15 18,28 8,26" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.5"/>
    <!-- Center right face -->
    <polygon points="24,18 18,15 18,28 28,26" fill="#991b1b" stroke="#7f1d1d" stroke-width="0.5"/>
    <!-- Lower left face -->
    <polygon points="6,22 8,26 12,32 8,28" fill="#991b1b" stroke="#7f1d1d" stroke-width="0.5"/>
    <!-- Lower right face -->
    <polygon points="30,22 28,26 24,32 28,28" fill="#7f1d1d" stroke="#7f1d1d" stroke-width="0.5"/>
    <!-- Bottom left face -->
    <polygon points="8,26 18,28 18,38 12,32" fill="#7f1d1d" stroke="#7f1d1d" stroke-width="0.5"/>
    <!-- Bottom right face -->
    <polygon points="28,26 18,28 18,38 24,32" fill="#881818" stroke="#7f1d1d" stroke-width="0.5"/>
    <!-- Bottom point -->
    <polygon points="12,32 18,38 24,32" fill="#601010" stroke="#7f1d1d" stroke-width="0.5"/>
    <!-- Highlight -->
    <polygon points="12,10 16,12 14,16 10,13" fill="white" opacity="0.2"/>
    <ellipse cx="14" cy="11" rx="2" ry="3" fill="white" opacity="0.15" transform="rotate(-15 14 11)"/>
    <!-- Ground shadow -->
    <ellipse cx="18" cy="41" rx="8" ry="2.5" fill="#00000018"/>
  </g>
</svg>