<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" width="36" height="44">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00000033"/></filter>
    <clipPath id="ac"><circle cx="18" cy="20" r="16"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <!-- Outer rind -->
    <circle cx="18" cy="20" r="16" fill="#f5f0e8" stroke="#a8956e" stroke-width="1"/>
    <!-- Irregular agate banding - wavy ellipses -->
    <g clip-path="url(#ac)">
      <!-- Band 1 - outermost -->
      <ellipse cx="17" cy="21" rx="14" ry="13.5" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.7"/>
      <!-- Band 2 -->
      <ellipse cx="16.5" cy="20.5" rx="11.5" ry="10.5" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.55"/>
      <!-- Band 3 -->
      <ellipse cx="17.5" cy="19.5" rx="9" ry="8.5" fill="none" stroke="#fbbf24" stroke-width="2.2" opacity="0.5"/>
      <!-- Band 4 -->
      <ellipse cx="16" cy="20" rx="6.5" ry="6" fill="none" stroke="#b45309" stroke-width="1.8" opacity="0.6"/>
      <!-- Band 5 - inner -->
      <ellipse cx="17" cy="19.5" rx="4" ry="3.8" fill="none" stroke="#92400e" stroke-width="1.5" opacity="0.7"/>
      <!-- Center fill -->
      <ellipse cx="16.5" cy="19.5" rx="2.5" ry="2.2" fill="#78350f" opacity="0.75"/>
      <!-- Translucent quartz zone -->
      <ellipse cx="20" cy="17" rx="3" ry="5" fill="white" opacity="0.12" transform="rotate(15 20 17)"/>
    </g>
    <!-- Subtle luster highlight -->
    <ellipse cx="12" cy="13" rx="4" ry="3" fill="white" opacity="0.15" transform="rotate(-20 12 13)"/>
    <!-- Ground shadow -->
    <ellipse cx="18" cy="40" rx="9" ry="3" fill="#00000018"/>
  </g>
</svg>