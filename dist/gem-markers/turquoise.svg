<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" width="36" height="44">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00000033"/></filter>
    <clipPath id="tc"><ellipse cx="18" cy="19" rx="14" ry="13"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <!-- Turquoise nugget - irregular freeform shape -->
    <ellipse cx="18" cy="19" rx="14" ry="13" fill="#2dd4bf" stroke="#0f766e" stroke-width="0.8"/>
    <!-- Color variation - slightly greener zone -->
    <ellipse cx="14" cy="22" rx="6" ry="5" fill="#14b8a6" opacity="0.4"/>
    <ellipse cx="22" cy="15" rx="5" ry="4" fill="#5eead4" opacity="0.3"/>
    <!-- Spider-web matrix veining (brown/black) -->
    <g clip-path="url(#tc)">
      <!-- Major veins -->
      <path d="M5,12 Q12,14 16,10 Q20,7 28,11" fill="none" stroke="#78350f" stroke-width="1" opacity="0.6"/>
      <path d="M8,20 Q14,18 18,22 Q22,26 30,22" fill="none" stroke="#78350f" stroke-width="0.9" opacity="0.55"/>
      <path d="M10,28 Q16,25 22,28 Q26,30 30,27" fill="none" stroke="#78350f" stroke-width="0.8" opacity="0.5"/>
      <!-- Cross veins -->
      <path d="M12,6 Q13,14 10,22 Q8,28 12,32" fill="none" stroke="#78350f" stroke-width="0.7" opacity="0.45"/>
      <path d="M22,8 Q20,16 22,22 Q24,26 22,30" fill="none" stroke="#78350f" stroke-width="0.8" opacity="0.5"/>
      <path d="M16,10 Q15,16 16,22" fill="none" stroke="#92400e" stroke-width="0.5" opacity="0.35"/>
      <path d="M26,12 Q24,18 26,24" fill="none" stroke="#92400e" stroke-width="0.5" opacity="0.35"/>
      <!-- Fine hairline veins -->
      <path d="M8,15 Q12,16 16,14" fill="none" stroke="#78350f" stroke-width="0.3" opacity="0.3"/>
      <path d="M20,18 Q24,20 28,18" fill="none" stroke="#78350f" stroke-width="0.3" opacity="0.3"/>
    </g>
    <!-- Waxy luster highlight -->
    <ellipse cx="14" cy="13" rx="5" ry="3.5" fill="white" opacity="0.2" transform="rotate(-15 14 13)"/>
    <ellipse cx="13" cy="12" rx="2" ry="1.5" fill="white" opacity="0.15"/>
    <!-- Ground shadow -->
    <ellipse cx="18" cy="40" rx="9" ry="3" fill="#00000018"/>
  </g>
</svg>