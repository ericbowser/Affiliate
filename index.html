  <!-- title/description/OG/Twitter tags are owned entirely by <SEO> (src/components/SEO.jsx + react-helmet-async)
       on every route. Nothing duplicated here — Helmet doesn't recognize hand-authored tags as its own
       and will add a second copy instead of replacing them if left in place. -->

  <meta name="robots" content="index, follow" />
  <meta name="impact-site-verification" value="079df32c-1896-4ad6-b917-137de9f2f015" />
  <title>Wasatch Rockhound</title>
  <!-- Inter is not applied site-wide; system sans keeps first paint fast -->
  <!-- Google tag — deferred until after first paint -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.addEventListener('load', function () {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-NW8P3LFDGD';
      document.head.appendChild(s);
      s.onload = function () {
        gtag('js', new Date());
        gtag('config', 'G-NW8P3LFDGD');
      };
    });
  </script>
</head>
